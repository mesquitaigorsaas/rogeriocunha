<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar momentos — Rogério Cunha</title>

    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" href="../assets/css/estilo.css">
    <link rel="stylesheet" href="../assets/css/painel.css">
</head>
<body class="painel">

    <header class="painel-topo">
        <div class="container">
            <a href="../index.html" class="marca">
                <strong>Rogério Cunha</strong>
                <span>Editar momentos</span>
            </a>

            <div class="painel-acoes">
                <a href="../index.html#momentos" class="btn">Ver o site</a>
                <button type="button" class="btn" id="botaoSair">Sair</button>
            </div>
        </div>
    </header>

    <main class="container">

        <div class="painel-cabeca">
            <h1>Momentos</h1>
            <p>
                As fotos da galeria. Escolha a foto no computador ou no celular e
                ela já sobe. <strong>A primeira da lista aparece maior</strong>;
                use as setas para mudar a ordem.
            </p>
        </div>

        <div style="margin-bottom: 26px;">
            <label class="btn principal" for="entradaFoto" id="rotuloNova">Adicionar foto</label>
            <input type="file" id="entradaFoto" class="entrada-arquivo" accept="image/*" multiple>
        </div>

        <div id="lista"></div>

    </main>

    <script src="../assets/js/supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/painel.js"></script>

    <script>
    (function () {
        'use strict';

        const { banco, exigirEditor, sair, subirImagem, avisar,
                confirmarNoBotao, proximaOrdem, trocarOrdem } = window.PAINEL;

        const lista = document.getElementById('lista');
        const entrada = document.getElementById('entradaFoto');
        const rotuloNova = document.getElementById('rotuloNova');

        let momentos = [];

        document.getElementById('botaoSair').addEventListener('click', sair);


        // =============================================================
        // O RECORTE
        //
        // O quadro da galeria é quadrado e não muda. Não dá para saber
        // se a próxima foto que ele subir é retrato ou paisagem, nem
        // que canto dela importa — então quem decide isso é ele, foto a
        // foto, pegando a imagem e arrastando dentro do quadrado.
        //
        // São dois números e mais um: os dois lados de um
        // object-position, que dizem que ponto da foto fica no centro
        // da atenção, e o zoom, que aproxima em volta desse mesmo
        // ponto. O zoom também é o que dá folga para arrastar: uma foto
        // que cabe justa no quadrado só ganha para onde ir depois de
        // ampliada.
        // =============================================================

        const ZOOM_MAXIMO = 4;

        /* Lê "50% 36%" e também o "center 36%" das fotos antigas. */
        function posicaoDe(enquadramento) {
            const nomes = { center: 50, left: 0, top: 0, right: 100, bottom: 100 };
            const lado = (parte) => {
                if (parte in nomes) return nomes[parte];
                const numero = parseFloat(parte);
                return Number.isFinite(numero) ? numero : 50;
            };

            const partes = String(enquadramento || '').trim().split(/\s+/);
            return { x: lado(partes[0]), y: lado(partes[1]) };
        }

        function entre(valor, minimo, maximo) {
            return Math.min(maximo, Math.max(minimo, valor));
        }

        /* Quantos pixels a foto anda quando a porcentagem anda 100 —
           um número por lado.

           São duas parcelas. A primeira é a sobra do object-fit: cover,
           que já sai multiplicada pelo zoom. A segunda é a própria
           origem do zoom se deslocando, que arrasta o que está
           ampliado; sem ela, uma foto sem sobra ficaria presa mesmo
           depois de aproximada, e o dedo dele não moveria nada. */
        function passoEmPixels(moldura, foto, zoom) {
            const quadro = moldura.getBoundingClientRect();
            const largura = foto.naturalWidth;
            const altura = foto.naturalHeight;

            if (!largura || !altura) return { x: 0, y: 0 };

            const escala = Math.min(quadro.width, quadro.height) / Math.min(largura, altura);

            return {
                x: Math.max(0, largura * escala - quadro.width) * zoom + (zoom - 1) * quadro.width,
                y: Math.max(0, altura * escala - quadro.height) * zoom + (zoom - 1) * quadro.height
            };
        }


        // =============================================================
        // CARREGAR E DESENHAR
        // =============================================================

        async function carregar() {
            const { data, error } = await banco
                .from('momentos')
                .select('*')
                .order('ordem', { ascending: true });

            if (error) {
                avisar('Não consegui carregar as fotos: ' + error.message, 'erro');
                return;
            }

            momentos = data || [];
            desenhar();
        }

        /**
         * O recado que explica por que o site mostra conteúdo e o painel
         * não. Some sozinho assim que a primeira linha entra no banco,
         * porque a tela vazia deixa de ser desenhada.
         */
        function explicarExemplos(texto) {
            const nota = document.createElement('p');
            nota.style.marginTop = '14px';
            nota.style.fontSize = '0.86rem';
            nota.style.lineHeight = '1.55';
            nota.style.color = '#8a8378';
            nota.textContent = texto;
            return nota;
        }


        function desenhar() {
            lista.replaceChildren();

            if (momentos.length === 0) {
                const vazio = document.createElement('div');
                vazio.className = 'vazio';
                vazio.innerHTML = '<strong>Nenhuma foto ainda</strong>';
                vazio.append('Clique em "Adicionar foto". Dá para escolher várias de uma vez.');
                vazio.appendChild(explicarExemplos('As fotos que aparecem no site agora são de exemplo, ' +
                    'escritas na própria página. A primeira foto que você adicionar aqui toma o lugar delas.'));
                lista.appendChild(vazio);
                return;
            }

            momentos.forEach((momento, posicao) => lista.appendChild(montarFicha(momento, posicao)));
        }

        function montarFicha(momento, posicao) {
            const ficha = document.createElement('div');
            ficha.className = 'ficha';

            // ---- topo ----
            const topo = document.createElement('div');
            topo.className = 'ficha-topo';

            const identidade = document.createElement('div');
            const nome = document.createElement('div');
            nome.className = 'ficha-titulo';
            nome.textContent = momento.descricao || 'Foto sem descrição';
            const situacao = document.createElement('span');
            situacao.className = 'ficha-sub';
            situacao.textContent = posicao === 0
                ? 'a primeira — aparece maior no site'
                : `${posicao + 1}ª da galeria`;
            identidade.append(nome, situacao);

            const setas = document.createElement('div');
            setas.className = 'ordem-setas';
            const subir = document.createElement('button');
            subir.type = 'button';
            subir.textContent = '↑';
            subir.title = 'Subir na galeria';
            subir.disabled = posicao === 0;
            subir.addEventListener('click', () => mover(posicao, posicao - 1));
            const descer = document.createElement('button');
            descer.type = 'button';
            descer.textContent = '↓';
            descer.title = 'Descer na galeria';
            descer.disabled = posicao === momentos.length - 1;
            descer.addEventListener('click', () => mover(posicao, posicao + 1));
            setas.append(subir, descer);

            topo.append(identidade, setas);

            // ---- corpo ----
            const corpo = document.createElement('div');
            corpo.className = 'ficha-corpo';

            // ---- o recorte: a moldura que se arrasta, e o zoom ----
            //
            // Os dois ficam na mesma coluna, um debaixo do outro. Zoom
            // e arrasto são o mesmo gesto partido em dois; separá-los
            // pela tela faria ele procurar um enquanto usa o outro.

            const recorte = document.createElement('div');

            const rotuloRecorte = document.createElement('label');
            rotuloRecorte.className = 'rotulo-recorte';
            rotuloRecorte.textContent = 'Enquadramento';

            const moldura = document.createElement('div');
            moldura.className = 'previa-foto';
            const foto = document.createElement('img');
            foto.src = momento.imagem_url;
            foto.alt = momento.descricao || '';
            moldura.appendChild(foto);

            const inicial = posicaoDe(momento.enquadramento);
            let px = inicial.x;
            let py = inicial.y;
            let zoom = entre(Number(momento.zoom) || 1, 1, ZOOM_MAXIMO);

            /* A barra precisa dizer o nome dela. Sozinha embaixo de um
               rótulo escrito "Enquadramento", ela é lida como a barra
               de posição que existia antes — e aí o arrasto na foto,
               que é o controle de verdade, passa despercebido. */
            const nomeZoom = document.createElement('span');
            nomeZoom.className = 'nome-zoom';
            nomeZoom.textContent = 'Zoom';

            const barraZoom = document.createElement('input');
            barraZoom.type = 'range';
            barraZoom.min = '1';
            barraZoom.max = String(ZOOM_MAXIMO);
            barraZoom.step = '0.05';
            barraZoom.value = String(zoom);
            barraZoom.setAttribute('aria-label', 'Zoom da foto');

            // No celular, acertar um ponto exato de uma barra fina com
            // o dedo é difícil. Os dois botões dão o passo miúdo.
            const menos = document.createElement('button');
            menos.type = 'button';
            menos.className = 'passo-zoom';
            menos.textContent = '−';
            menos.title = 'Afastar';
            menos.setAttribute('aria-label', 'Afastar');

            const mais = document.createElement('button');
            mais.type = 'button';
            mais.className = 'passo-zoom';
            mais.textContent = '+';
            mais.title = 'Aproximar';
            mais.setAttribute('aria-label', 'Aproximar');

            const centralizar = document.createElement('button');
            centralizar.type = 'button';
            centralizar.className = 'btn miudo';
            centralizar.textContent = 'Centralizar';
            centralizar.title = 'Volta a foto ao meio, sem zoom';

            const dicaRecorte = document.createElement('p');
            dicaRecorte.className = 'dica';

            function aplicar() {
                const posicao = `${Math.round(px)}% ${Math.round(py)}%`;
                foto.style.objectPosition = posicao;
                foto.style.transformOrigin = posicao;
                foto.style.transform = `scale(${zoom})`;
            }

            /* A dica diz o que aquela foto, naquele zoom, aceita fazer.
               Uma foto quadrada sem zoom não anda para lado nenhum, e
               uma superfície de arrasto que não arrasta parece defeito
               — então ela avisa, e ensina a saída. */
            function atualizarDica() {
                const passo = passoEmPixels(moldura, foto, zoom);
                const anda = { lado: passo.x > 0.5, cima: passo.y > 0.5 };

                if (anda.lado && anda.cima) {
                    dicaRecorte.textContent = 'Arraste a foto para escolher o que aparece no quadrado. Use o zoom para aproximar.';
                } else if (anda.cima) {
                    dicaRecorte.textContent = 'Arraste a foto para cima e para baixo. Para movê-la de lado também, aumente o zoom.';
                } else if (anda.lado) {
                    dicaRecorte.textContent = 'Arraste a foto de um lado ao outro. Para movê-la para cima e para baixo também, aumente o zoom.';
                } else {
                    dicaRecorte.textContent = 'Esta foto cabe inteira no quadrado, então não há para onde arrastá-la. Aumente o zoom para poder mexer.';
                }
            }

            // naturalWidth só existe depois de a imagem chegar, e a
            // dica depende dele. Se já estiver em cache, o load não
            // dispara — daí as duas chamadas.
            foto.addEventListener('load', atualizarDica);
            if (foto.complete) atualizarDica();

            function mudarZoom(novo) {
                zoom = entre(Number(novo), 1, ZOOM_MAXIMO);
                barraZoom.value = String(zoom);
                aplicar();
                atualizarDica();
            }

            barraZoom.addEventListener('input', () => mudarZoom(barraZoom.value));
            menos.addEventListener('click', () => mudarZoom(zoom - 0.25));
            mais.addEventListener('click', () => mudarZoom(zoom + 0.25));

            centralizar.addEventListener('click', () => {
                px = 50;
                py = 50;
                mudarZoom(1);
            });

            /* O arrasto. Ponteiro, e não mouse: o mesmo código serve
               para o dedo no celular e para o mouse no computador.

               setPointerCapture é o que faz o gesto continuar valendo
               quando ele sai da moldura no meio do movimento — sem
               isso, a foto trava na borda e ele acha que chegou ao
               fim. */
            let arrastando = false;
            let ultimoX = 0;
            let ultimoY = 0;

            moldura.addEventListener('pointerdown', (evento) => {
                arrastando = true;
                ultimoX = evento.clientX;
                ultimoY = evento.clientY;
                moldura.setPointerCapture(evento.pointerId);
                moldura.classList.add('arrastando');
                evento.preventDefault();
            });

            moldura.addEventListener('pointermove', (evento) => {
                if (!arrastando) return;

                const passo = passoEmPixels(moldura, foto, zoom);
                const dx = evento.clientX - ultimoX;
                const dy = evento.clientY - ultimoY;
                ultimoX = evento.clientX;
                ultimoY = evento.clientY;

                // Levar a foto para a direita é revelar o que estava à
                // esquerda: a porcentagem anda ao contrário do dedo.
                if (passo.x > 0) px = entre(px - (dx / passo.x) * 100, 0, 100);
                if (passo.y > 0) py = entre(py - (dy / passo.y) * 100, 0, 100);

                aplicar();
            });

            const soltar = (evento) => {
                if (!arrastando) return;
                arrastando = false;
                moldura.releasePointerCapture(evento.pointerId);
                moldura.classList.remove('arrastando');
            };
            moldura.addEventListener('pointerup', soltar);
            moldura.addEventListener('pointercancel', soltar);

            aplicar();

            const linhaZoom = document.createElement('div');
            linhaZoom.className = 'linha-zoom';
            linhaZoom.append(nomeZoom, menos, barraZoom, mais, centralizar);

            // A dica vem logo abaixo da foto, colada no gesto que ela
            // explica, e antes da barra de zoom. Depois da barra, ela
            // seria lida como explicação da barra.
            recorte.append(rotuloRecorte, moldura, dicaRecorte, linhaZoom);

            const campos = document.createElement('div');

            const campoDescricao = criarCampo(
                'Descrição', momento.descricao || '',
                'Não aparece na tela. É o que uma pessoa cega ouve no lugar da foto, e o que o Google lê.'
            );

            campos.append(campoDescricao);
            corpo.append(recorte, campos);

            // ---- ações ----
            const acoes = document.createElement('div');
            acoes.className = 'ficha-acoes';

            const salvar = document.createElement('button');
            salvar.type = 'button';
            salvar.className = 'btn principal';
            salvar.textContent = 'Salvar foto';
            salvar.addEventListener('click', () => gravar(momento, {
                descricao: campoDescricao.querySelector('input').value,
                enquadramento: `${Math.round(px)}% ${Math.round(py)}%`,
                zoom: Number(zoom.toFixed(2))
            }, salvar));

            const trocar = document.createElement('label');
            trocar.className = 'btn';
            trocar.textContent = 'Trocar a imagem';
            const entradaTroca = document.createElement('input');
            entradaTroca.type = 'file';
            entradaTroca.className = 'entrada-arquivo';
            entradaTroca.accept = 'image/*';
            entradaTroca.addEventListener('change', (e) => {
                if (e.target.files[0]) trocarImagem(momento, e.target.files[0]);
            });
            trocar.appendChild(entradaTroca);

            const apagar = document.createElement('button');
            apagar.type = 'button';
            apagar.className = 'btn perigo';
            apagar.textContent = 'Apagar';
            apagar.addEventListener('click', () => remover(momento));

            acoes.append(salvar, trocar, apagar);

            ficha.append(topo, corpo, acoes);
            return ficha;
        }

        function criarCampo(rotulo, valor, dica) {
            const campo = document.createElement('div');
            campo.className = 'campo';

            const label = document.createElement('label');
            label.textContent = rotulo;

            const input = document.createElement('input');
            input.type = 'text';
            input.value = valor;

            campo.append(label, input);

            if (dica) {
                const p = document.createElement('p');
                p.className = 'dica';
                p.textContent = dica;
                campo.appendChild(p);
            }

            return campo;
        }


        // =============================================================
        // ENVIAR, GRAVAR, APAGAR
        // =============================================================

        entrada.addEventListener('change', async (e) => {
            const arquivos = Array.from(e.target.files);
            if (arquivos.length === 0) return;

            rotuloNova.textContent = 'Enviando...';
            rotuloNova.style.pointerEvents = 'none';

            let enviadas = 0;

            // Uma de cada vez, e não todas juntas. São fotos de celular
            // de 3 a 8 MB: dez subindo em paralelo numa internet de
            // cidade pequena travam as dez.
            for (const arquivo of arquivos) {
                try {
                    const url = await subirImagem(arquivo, 'momentos');

                    const { error } = await banco.from('momentos').insert({
                        imagem_url: url,
                        descricao: '',
                        ordem: proximaOrdem(momentos) + enviadas * 10,
                        publicado: true
                    });

                    if (error) throw new Error(error.message);
                    enviadas++;
                } catch (erro) {
                    avisar(`Não consegui enviar ${arquivo.name}: ${erro.message}`, 'erro');
                }
            }

            rotuloNova.textContent = 'Adicionar foto';
            rotuloNova.style.pointerEvents = '';
            entrada.value = '';

            if (enviadas > 0) {
                avisar(enviadas === 1 ? 'Foto no ar.' : `${enviadas} fotos no ar.`);
                carregar();
            }
        });

        async function gravar(momento, valores, botao) {
            botao.disabled = true;

            const { error } = await banco.from('momentos').update({
                descricao: valores.descricao.trim(),
                enquadramento: valores.enquadramento,
                zoom: valores.zoom
            }).eq('id', momento.id);

            botao.disabled = false;

            if (error) {
                avisar('Não consegui salvar: ' + error.message, 'erro');
                return;
            }

            confirmarNoBotao(botao, 'Foto salva ✓');
            avisar('Foto salva.');
            carregar();
        }

        async function trocarImagem(momento, arquivo) {
            avisar('Enviando a imagem...');

            try {
                const url = await subirImagem(arquivo, 'momentos');

                const { error } = await banco.from('momentos')
                    .update({ imagem_url: url })
                    .eq('id', momento.id);

                if (error) throw new Error(error.message);

                avisar('Imagem trocada.');
                carregar();
            } catch (erro) {
                avisar(erro.message, 'erro');
            }
        }

        async function mover(de, para) {
            try {
                await trocarOrdem('momentos', momentos[de], momentos[para]);
                await carregar();
                avisar('Ordem alterada.');
            } catch (erro) {
                avisar(erro.message, 'erro');
            }
        }

        async function remover(momento) {
            if (!window.confirm('Apagar esta foto? Isso não tem como desfazer.')) return;

            const { error } = await banco.from('momentos').delete().eq('id', momento.id);

            if (error) {
                avisar('Não consegui apagar: ' + error.message, 'erro');
                return;
            }

            avisar('Foto apagada.');
            carregar();
        }


        // =============================================================
        // ENTRADA
        // =============================================================
        (async function () {
            const editor = await exigirEditor();
            if (!editor) return;

            carregar();
        })();
    })();
    </script>

</body>
</html>
