<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar vídeos — Rogério Cunha</title>

    <!-- Tela de trabalho: não tem por que aparecer em busca. -->
    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" href="../assets/css/estilo.css">
    <link rel="stylesheet" href="../assets/css/painel.css">
</head>
<body class="painel">

    <header class="painel-topo">
        <div class="container">
            <a href="../index.html" class="marca">
                <strong>Rogério Cunha</strong>
                <span>Editar vídeos</span>
            </a>

            <div class="painel-acoes">
                <a href="../index.html#videos" class="btn">Ver o site</a>
                <button type="button" class="btn" id="botaoSair">Sair</button>
            </div>
        </div>
    </header>

    <main class="container">

        <div class="painel-cabeca">
            <h1>Vídeos</h1>
            <p>
                Cole o endereço do vídeo no YouTube — o da barra do navegador
                mesmo, inteiro. Ao salvar, ele já vai para o site.
                <strong>O primeiro da lista é o que aparece grande</strong> na
                página inicial; use as setas para mudar a ordem.
            </p>
        </div>

        <div style="margin-bottom: 26px;">
            <button type="button" class="btn principal" id="botaoNovo">Adicionar vídeo</button>
        </div>

        <div id="lista"></div>

    </main>

    <script src="../assets/js/supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/painel.js"></script>

    <script>
    (function () {
        'use strict';

        const { banco, exigirEditor, sair, codigoDoYoutube, avisar,
                confirmarNoBotao, proximaOrdem, trocarOrdem } = window.PAINEL;

        const lista = document.getElementById('lista');

        // Tudo o que a tela carregou. As setas de ordem precisam saber
        // quem é o vizinho de cima e o de baixo, e ir ao banco a cada
        // clique para descobrir isso seria uma consulta por seta.
        let videos = [];

        // O cartão em branco de um vídeo que ainda não existe no banco.
        //
        // Ele vive só aqui, na tela, até a pessoa colar o endereço e
        // salvar. Antes eu criava a linha no banco na hora de clicar em
        // "Adicionar", com um código de mentira dentro — e aí, com o
        // vídeo indo ao ar assim que é salvo, essa linha vazia apareceria
        // na página inicial como um quadro quebrado.
        let rascunho = null;

        document.getElementById('botaoSair').addEventListener('click', sair);


        // =============================================================
        // CARREGAR
        // =============================================================

        async function carregar() {
            const { data, error } = await banco
                .from('videos')
                .select('*')
                .order('ordem', { ascending: true });

            if (error) {
                avisar('Não consegui carregar os vídeos: ' + error.message, 'erro');
                return;
            }

            videos = data || [];
            desenhar();
        }


        // =============================================================
        // DESENHAR
        // =============================================================

        /**
         * O recado que explica por que o site mostra conteúdo e o painel
         * não. Some sozinho assim que a primeira linha entra no banco,
         * porque a tela vazia deixa de ser desenhada.
         */
        function explicarExemplos(texto) {
            const nota = document.createElement('p');
            nota.style.marginTop = '14px';
            nota.style.fontSize = '0.86rem';
            nota.style.lineHeight = '1.55';
            nota.style.color = '#8a8378';
            nota.textContent = texto;
            return nota;
        }


        function desenhar() {
            lista.replaceChildren();

            if (videos.length === 0 && !rascunho) {
                const vazio = document.createElement('div');
                vazio.className = 'vazio';
                vazio.innerHTML = '<strong>Nenhum vídeo ainda</strong>';
                vazio.append('Clique em "Adicionar vídeo" e cole o endereço de um vídeo do YouTube.');
                vazio.appendChild(explicarExemplos('Os vídeos que aparecem no site agora são de exemplo, ' +
                    'escritos na própria página. O primeiro que você adicionar aqui toma o lugar deles.'));
                lista.appendChild(vazio);
                return;
            }

            videos.forEach((video, posicao) => lista.appendChild(montarFicha(video, posicao)));

            if (rascunho) lista.appendChild(montarFicha(rascunho, -1));
        }

        function montarFicha(video, posicao) {
            const novo = posicao === -1;

            const ficha = document.createElement('div');
            ficha.className = 'ficha' + (novo ? ' rascunho' : '');

            // ---- topo: qual é, e onde está na fila ----
            const topo = document.createElement('div');
            topo.className = 'ficha-topo';

            const identidade = document.createElement('div');
            const nome = document.createElement('div');
            nome.className = 'ficha-titulo';
            nome.textContent = novo
                ? 'Vídeo novo'
                : (video.titulo || 'Vídeo sem título');

            const situacao = document.createElement('span');
            situacao.className = 'ficha-sub';
            // O lugar na fila é a única informação de estado que sobrou,
            // e é a que importa: ela diz qual vai aparecer grande.
            situacao.textContent = novo
                ? 'ainda não salvo'
                : (posicao === 0 ? 'o primeiro — aparece grande no site' : `${posicao + 1}º da fileira`);

            identidade.append(nome, situacao);
            topo.appendChild(identidade);

            if (!novo) {
                const setas = document.createElement('div');
                setas.className = 'ordem-setas';

                const subir = document.createElement('button');
                subir.type = 'button';
                subir.textContent = '↑';
                subir.title = 'Subir na lista';
                subir.disabled = posicao === 0;
                subir.addEventListener('click', () => mover(posicao, posicao - 1));

                const descer = document.createElement('button');
                descer.type = 'button';
                descer.textContent = '↓';
                descer.title = 'Descer na lista';
                descer.disabled = posicao === videos.length - 1;
                descer.addEventListener('click', () => mover(posicao, posicao + 1));

                setas.append(subir, descer);
                topo.appendChild(setas);
            }

            // ---- corpo: prévia à esquerda, campos à direita ----
            const corpo = document.createElement('div');
            corpo.className = 'ficha-corpo';

            const previa = document.createElement('div');
            previa.className = 'previa-video';
            desenharPrevia(previa, video.codigo_youtube);

            const campos = document.createElement('div');

            const campoEndereco = criarCampo('Endereço no YouTube', 'text',
                video.codigo_youtube ? `https://youtu.be/${video.codigo_youtube}` : '',
                'Cole o endereço inteiro. Serve o do navegador, o encurtado ou o de Shorts.');

            // A prévia muda enquanto ele digita: é assim que ele sabe
            // que colou o vídeo certo antes de salvar.
            campoEndereco.querySelector('input').addEventListener('input', (e) => {
                desenharPrevia(previa, codigoDoYoutube(e.target.value));
            });

            const campoTitulo = criarCampo('Título', 'text', video.titulo || '',
                'Aparece embaixo do vídeo, na página inicial.');
            const campoLegenda = criarCampo('Legenda', 'text', video.legenda || '',
                'Uma linha curta dizendo do que se trata.');

            campos.append(campoEndereco, campoTitulo, campoLegenda);
            corpo.append(previa, campos);

            // ---- ações ----
            const acoes = document.createElement('div');
            acoes.className = 'ficha-acoes';

            const salvar = document.createElement('button');
            salvar.type = 'button';
            salvar.className = 'btn principal';
            salvar.textContent = novo ? 'Salvar e publicar' : 'Salvar vídeo';
            salvar.addEventListener('click', () => gravar(video, novo, {
                endereco: campoEndereco.querySelector('input').value,
                titulo: campoTitulo.querySelector('input').value,
                legenda: campoLegenda.querySelector('input').value
            }, salvar));

            const apagar = document.createElement('button');
            apagar.type = 'button';
            apagar.className = 'btn perigo';
            apagar.textContent = novo ? 'Descartar' : 'Apagar';
            apagar.addEventListener('click', () => {
                if (novo) {
                    rascunho = null;
                    desenhar();
                    return;
                }
                remover(video);
            });

            acoes.append(salvar, apagar);

            ficha.append(topo, corpo, acoes);
            return ficha;
        }

        function criarCampo(rotulo, tipo, valor, dica) {
            const campo = document.createElement('div');
            campo.className = 'campo';

            const label = document.createElement('label');
            label.textContent = rotulo;

            const input = document.createElement('input');
            input.type = tipo;
            input.value = valor;

            campo.append(label, input);

            if (dica) {
                const p = document.createElement('p');
                p.className = 'dica';
                p.textContent = dica;
                campo.appendChild(p);
            }

            return campo;
        }

        function desenharPrevia(caixa, codigo) {
            caixa.replaceChildren();

            if (!codigo) {
                caixa.textContent = 'A capa do vídeo aparece aqui quando o endereço estiver certo.';
                return;
            }

            const capa = document.createElement('img');
            capa.src = `https://img.youtube.com/vi/${codigo}/hqdefault.jpg`;
            capa.alt = '';
            caixa.appendChild(capa);
        }


        // =============================================================
        // GRAVAR
        // =============================================================

        async function gravar(video, novo, valores, botao) {
            const codigo = codigoDoYoutube(valores.endereco);

            // Sem código não há vídeo. Melhor recusar aqui, com o motivo
            // na tela, do que gravar uma linha que a página inicial vai
            // mostrar como quadro cinza.
            if (!codigo) {
                avisar('Esse endereço não parece ser de um vídeo do YouTube. Confira e cole de novo.', 'erro');
                return;
            }

            botao.disabled = true;

            const campos = {
                codigo_youtube: codigo,
                titulo: valores.titulo.trim(),
                legenda: valores.legenda.trim(),
                // Salvou, está no ar. Sem passo a mais para lembrar.
                publicado: true
            };

            const { error } = novo
                ? await banco.from('videos').insert({ ...campos, ordem: proximaOrdem(videos) })
                : await banco.from('videos').update(campos).eq('id', video.id);

            botao.disabled = false;

            if (error) {
                avisar('Não consegui salvar: ' + error.message, 'erro');
                return;
            }

            // Duas confirmações, e não é exagero: o recado no rodapé some
            // em segundos e pode passar batido — foi o que aconteceu na
            // primeira versão desta tela. O botão que ele acabou de
            // clicar é onde o olho dele já está.
            confirmarNoBotao(botao, 'Vídeo salvo ✓');
            avisar(novo ? 'Vídeo salvo e publicado no site.' : 'Vídeo salvo.');

            if (novo) rascunho = null;
            carregar();
        }

        function criar() {
            if (rascunho) {
                avisar('Termine o vídeo que você começou antes de adicionar outro.', 'erro');
                return;
            }

            rascunho = { codigo_youtube: '', titulo: '', legenda: '' };
            desenhar();
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        async function mover(de, para) {
            try {
                await trocarOrdem('videos', videos[de], videos[para]);
                await carregar();
                avisar('Ordem alterada.');
            } catch (erro) {
                avisar(erro.message, 'erro');
            }
        }

        async function remover(video) {
            const nome = video.titulo || 'este vídeo';
            if (!window.confirm(`Apagar ${nome}? Isso não tem como desfazer.`)) return;

            const { error } = await banco.from('videos').delete().eq('id', video.id);

            if (error) {
                avisar('Não consegui apagar: ' + error.message, 'erro');
                return;
            }

            avisar('Vídeo apagado.');
            carregar();
        }

        document.getElementById('botaoNovo').addEventListener('click', criar);


        // =============================================================
        // ENTRADA
        // =============================================================
        (async function () {
            const editor = await exigirEditor();
            if (!editor) return;
            carregar();
        })();
    })();
    </script>

</body>
</html>
